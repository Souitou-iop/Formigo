name: Formigo
options:
  bundleIdPrefix: dev.formigo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    from: 6.2.0
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    from: 0.6.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_UPCOMING_FEATURE_BARE_SLASH_REGEX_LITERALS: YES
    OTHER_SWIFT_FLAGS: "-enable-bare-slash-regex"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "400"
targets:
  Formigo:
    type: application
    platform: iOS
    sources:
      - path: Formigo
    dependencies:
      - package: Yams
      - package: TOMLKit
      - package: ZIPFoundation
    info:
      path: Formigo/Info.plist
      properties:
        CFBundleDisplayName: Formigo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryAddUsageDescription: Formigo 把转换好的图片和视频存到你的相册。
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.formigo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  FormigoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FormigoTests
    dependencies:
      - target: Formigo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.formigo.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Formigo.app/Formigo
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Formigo:
    build:
      targets:
        Formigo: all
        FormigoTests: [test]
    test:
      targets: [FormigoTests]
