<section id="ux" data-transition="fade">
<div class="mask"><p class="title" style="--i:0">细节，替你想好了。</p></div>
<div class="grid" style="flex:1; grid-template-columns:1.55fr 1fr; grid-template-rows:1fr 1fr 1fr">
<div class="card zoom" style="grid-row:1 / 4; --i:1; padding:44px; gap:10px">
<p class="h3" style="font-size:38px">按类型分组，一次设好整批</p>
<p class="small">每组单独选目标格式；「全部转为」一键统一；单个文件还能另选</p>
<img src="/_blob/f544ab0290385acf2cb03e30e0997d01" alt="桌面端队列：按类型分组的文件与右侧格式选择" style="width:920px; height:520px; object-fit:contain; border-radius:24px; background:#f5f5f7; margin-top:10px">
</div>
<div class="card sm rise" style="--i:3"><p class="h3" style="font-size:34px">只显示有用的选项</p><p class="small">画质、尺寸、位深、缩进，按目标格式出现</p></div>
<div class="card sm rise" style="--i:4"><p class="h3" style="font-size:34px">右键就能找到</p><p class="small">在访达 / 资源管理器中显示、直接打开、定位原文件</p></div>
<div class="card sm sky rise" style="--i:5; padding-right:250px"><p class="h3" style="font-size:34px">转完就告诉你</p><p class="small">完成后发系统通知</p>
<img class="pop" src="/_blob/fd6df7cf1c5110f106f511d3ae2b98ec" alt="小地鼠在笔记本电脑上打字" style="position:absolute; left:400px; top:6px; width:230px; height:210px; object-fit:contain; --i:6">
</div>
</div>
<aside>使用细节：多种文件一起拖进来会按类型分组，每组可以单独选格式，也能一键全部转成同一种。选项只显示和目标格式相关的。转换好的文件右键可以直接在访达里显示或打开，完成后还会发通知。</aside>
