# Converts a sample of every format each app reads to every format it
# offers, on each platform's real engine: the desktop's with the FFmpeg it
# bundles, Android's on an emulator's own codecs, iOS's on a simulator.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop conversions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fetch FFmpeg
        run: tools/fetch-ffmpeg.sh darwin
      - name: Test, every source to every target
        run: |
          export FORMIGO_FFMPEG="$PWD/resources/darwin-arm64/bin/ffmpeg"
          FORMIGO_MATRIX=1 go test -v -run 'TestMatrix' ./internal/convert
          go test ./...

  android:
    name: Android conversions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Every source to every target, on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-device-test
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore

  ios:
    name: iOS conversions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test on a simulator
        working-directory: ios
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project Formigo.xcodeproj -scheme Formigo -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages | tail -n 60
